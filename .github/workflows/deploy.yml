name: Deploy

on:
  push:
    branches: [main]
  # Redeploy the current main without a new commit.
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'pixel-peep' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

      - name: Check the deploy credentials before touching anything
        run: |
          set -uo pipefail
          # Cloudflare answers every credential problem with the same opaque
          # "Authentication error [code: 10000]". These two probes separate the
          # cases that actually need different fixes.
          : "${CLOUDFLARE_API_TOKEN:?не задан секрет CLOUDFLARE_API_TOKEN (Settings → Environments → production)}"
          : "${CLOUDFLARE_ACCOUNT_ID:?не задан секрет CLOUDFLARE_ACCOUNT_ID (он же виден в адресе дашборда Cloudflare)}"

          curl -sS https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o verify.json
          node -e '
            const r = require("./verify.json");
            if (!r.success) {
              console.error("::error::Сам токен недействителен: " + JSON.stringify(r.errors));
              console.error("Секрет CLOUDFLARE_API_TOKEN должен быть API Token (My Profile → API Tokens),");
              console.error("а не Global API Key и не Account ID.");
              process.exit(1);
            }
            console.log("Токен активен, статус:", r.result && r.result.status);
          '

          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o access.json
          # Which accounts the token can see at all; tells apart "wrong id" from
          # "right id, wrong permission". This log is public, so identifiers are
          # only ever compared and masked, never printed in full.
          curl -sS "https://api.cloudflare.com/client/v4/accounts" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o accounts.json
          node -e '
            const mask = (id) => id ? id.slice(0, 6) + "…" + id.slice(-4) : "(пусто)";
            const wanted = process.env.CLOUDFLARE_ACCOUNT_ID;
            const access = require("./access.json");
            if (access.success) { console.log("Доступ к Pages в этом аккаунте есть."); process.exit(0); }

            console.error("::error::Токен живой, но до Pages аккаунта " + mask(wanted) + " не достаёт: " +
              JSON.stringify(access.errors));

            const list = require("./accounts.json");
            const ids = list.success && Array.isArray(list.result) ? list.result.map((a) => a.id) : null;

            if (ids && ids.length > 0) {
              console.error("Токену видны аккаунты: " + ids.map(mask).join(", "));
              console.error(ids.includes(wanted)
                ? "→ Аккаунт верный, значит не хватает права: нужна строка\n" +
                  "  Account · Cloudflare Pages · Edit (именно Edit, не Read)."
                : "→ CLOUDFLARE_ACCOUNT_ID не совпадает ни с одним из них — в секрете\n" +
                  "  не тот идентификатор. Account ID это 32 символа сразу после\n" +
                  "  dash.cloudflare.com/ в адресной строке.");
            } else {
              // An empty list is not proof of a wrong id: a Pages-scoped token
              // may simply not be allowed to enumerate accounts. Both causes
              // stay on the table rather than guessing one.
              console.error("Список аккаунтов этим токеном пуст — он не говорит, какая из причин верна.");
              console.error("Проверьте обе, в My Profile → API Tokens → ваш токен → Edit:");
              console.error("  1. Permissions: Account · Cloudflare Pages · Edit (именно Edit, не Read);");
              console.error("  2. Account Resources: Include · нужный аккаунт (не пусто и не чужой);");
              console.error("  3. что в секрете Account ID (" + mask(wanted) + "), а не Zone ID —");
              console.error("     Account ID стоит сразу после dash.cloudflare.com/ в адресе.");
            }
            process.exit(1);
          '

      - name: Create the Pages project if it does not exist
        run: |
          set -euo pipefail
          # Straight to the API rather than through wrangler: `--json` still
          # prints human-readable notices to stdout, which breaks any parser.
          # The dashboard no longer offers "Pages → Direct Upload" either, so
          # the project is provisioned here instead of by hand.
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          # Ask about this one project rather than listing them: the list
          # endpoint rejects large per_page values, and paginating to find a
          # known name would be work for nothing.
          code=$(curl -sS -o project.json -w '%{http_code}' "$api/$PROJECT" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          if [ "$code" = "200" ]; then
            exists=yes
          elif [ "$code" = "404" ]; then
            exists=no
          else
            echo "::error::Неожиданный ответ $code при проверке проекта $PROJECT:"
            cat project.json
            exit 1
          fi
          if [ "$exists" = "no" ]; then
            echo "Проекта $PROJECT нет, создаю"
            curl -sS -X POST "$api" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              -d "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}" -o created.json
            node -e 'const r=require("./created.json"); if(!r.success){console.error(JSON.stringify(r.errors));process.exit(1)}'
          fi

      - name: Remember the currently live deployment, for rollback
        id: previous
        run: |
          set -euo pipefail
          curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments?env=production" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o deployments.json
          id=$(node -e '
            const r = require("./deployments.json");
            const list = r.success && Array.isArray(r.result) ? r.result : [];
            const live = [...list].sort((a, b) => new Date(b.created_on) - new Date(a.created_on))[0];
            console.log(live?.id ?? "");
          ')
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          npx wrangler pages deploy dist \
            --project-name="$PROJECT" \
            --branch=main \
            --commit-dirty=true | tee deploy.log
          url=$(grep -Eo 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test the deployed site
        id: smoke
        env:
          # Actions runners ship Chrome; no browser download needed.
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npm run smoke

      - name: Roll back on a failed smoke test
        if: failure() && steps.smoke.outcome == 'failure' && steps.previous.outputs.id != ''
        run: |
          set -euo pipefail
          # A silent degradation — usually _headers missing from the publish
          # directory — is exactly what the smoke test exists to catch.
          # wrangler has no rollback command, so this goes straight to the API.
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments/${{ steps.previous.outputs.id }}/rollback" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' | tee rollback.json
          node -e 'const r=require("./rollback.json"); if(!r.success){console.error(r.errors);process.exit(1)}'
          echo "::error::Smoke-тест не прошёл, откатились на ${{ steps.previous.outputs.id }}"

      - name: Upload the failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
